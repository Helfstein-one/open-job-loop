[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-job-loop"
version = "0.1.0"
description = "Autonomous, privacy-first CLI agent executing closed loops to discover, deduplicate, evaluate technical fit, and structure job applications."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Open Job Loop Team" }
]
keywords = ["agent", "cli", "job-search", "duckdb", "instructor", "local-llm", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "duckdb>=1.0.0",
    "sqlmodel>=0.0.16",
    "instructor>=1.0.0",
    "openai>=1.0.0",
    "mcp>=1.0.0",
    "playwright>=1.42.0",
    "pyyaml>=6.0.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
open-job-loop = "src.cli:app"
jobloop = "src.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F403", "F405", "E402", "E741", "E701", "W291", "W293", "F841"]

[tool.black]
line-length = 100
target-version = ['py312']

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
disable_error_code = [
    "override",
    "no-redef",
    "union-attr",
    "return-value",
    "arg-type",
    "call-arg",
    "has-type",
    "assignment",
    "index",
    "name-defined",
    "import-untyped",
    "attr-defined",
]
